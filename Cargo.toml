[package]
name = "atask"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An async task implementation"
documentation = "https://docs.rs/atask"
repository = "https://github.com/Spartan2909/atask"
readme = "./README.md"
categories = ["asynchronous", "concurrency", "no-std"]
keywords = ["async", "async-task", "executor", "future"]
rust-version = "1.85.0"

[dependencies]
pin-project = "1.1.10"
thiserror = "2.0.18"

[features]
default = ["std"]
std = []

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
dbg_macro = "warn"
missing_inline_in_public_items = "warn"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
non_send_fields_in_send_ty = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
semicolon_inside_block = "warn"        # Confusing name: semicolons *should* be inside the block.
todo = "warn"
undocumented_unsafe_blocks = "deny"
use_self = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
